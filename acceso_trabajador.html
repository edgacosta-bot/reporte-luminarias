<!DOCTYPE html>

<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso Obra</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="auth.js"></script>

<script src="/utils/ui.js"></script>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI';
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  text-align: center;
}

body.ok { background: #16a34a; color: white; }
body.warn { background: #f59e0b; color: #111827; }
body.error { background: #dc2626; color: white; }

.container {
  max-width: 360px;
  width: 92%;
  padding: 20px;
}

input, button {
  width: 100%;
  height: 52px;
  padding: 0 16px;
  margin-top: 12px;
  border-radius: 14px;
  border: none;
  font-size: 16px;
  font-weight: 600;
  box-sizing: border-box;
}

button {
  background: #2563eb;
  color: white;
}

button:disabled {
  opacity: 0.6;
}

input {
  background: #020617;
  color: white;
  text-align: center;
  font-size: 18px;
  letter-spacing: 2px;
}

.hidden {
  display: none;
}
</style>

</head>

<body>

<div class="container">

<h2 id="titulo">🚧 Acceso obra</h2>

<h1 id="estado">Validando...</h1>

<div id="detalle"></div>

<input
  type="password"
  id="pin"
  placeholder="Ingrese PIN del vigilante">

<button id="btnValidar">
  Validar
</button>

<button
  id="btnRegistrar"
  class="hidden">
  Registrar
</button>

</div>

<script>

const qr =
  new URLSearchParams(window.location.search)
    .get("qr");

let trabajador = null;
let vigilante = null;
let accesoAbierto = null;
let tipoAccion = "";

init();


// ==========================================================
// INICIO
// ==========================================================

async function init(){

  if (!qr){

    pintar(
      "QR inválido",
      "error"
    );

    return;
  }

  const { data, error } =
    await supabaseClient
      .rpc(
        "validar_acceso_trabajador_obra",
        {
          p_qr: qr
        }
      );

  if (error){

    console.error(error);

    pintar(
      error.message || "Acceso no permitido",
      "error"
    );

    return;
  }

  if (!data || data.length === 0){

    pintar(
      "Acceso no permitido",
      "error"
    );

    return;
  }

  trabajador = data[0];


  // ========================================================
  // SUSPENSIÓN TEMPORAL
  // ========================================================

  if (trabajador.acceso_suspendido === true){

    document.body.className = "error";

    titulo.innerText =
      "🚫 Acceso suspendido";

    estado.innerText =
      "No es posible autorizar el acceso";

    detalle.innerHTML = `

      <p>
        <b>${trabajador.nombre}</b>
      </p>

      <p>

        <b>Motivo:</b><br>

        ${
          trabajador.motivo_suspension
          ||
          (
            trabajador.fecha_omision
              ? `Omisión en el registro de salida del ${formatearFecha(trabajador.fecha_omision)}.`
              : "Omisión en el registro de salida."
          )
        }

      </p>

      <p>

        <b>Acceso suspendido hasta:</b><br>

        ${formatearFecha(trabajador.suspendido_hasta)}

      </p>

      <p>
        El acceso se restablecerá automáticamente
        al concluir la fecha indicada.
      </p>

    `;

    ocultarValidacion();

    return;
  }


  // ========================================================
  // OBRA
  // ========================================================

  if (!trabajador.obra_aprobada){

    pintar(
      "Obra no aprobada",
      "error"
    );

    return;
  }


  // ========================================================
  // TRABAJADOR
  // ========================================================

  if (!trabajador.activo){

    pintar(
      "Trabajador inactivo",
      "error"
    );

    return;
  }


  // ========================================================
  // VIGENCIA
  // ========================================================

  const hoy =
    new Date().toLocaleDateString(
      "sv-SE",
      {
        timeZone: "America/Mexico_City"
      }
    );

  if (
    (trabajador.fecha_inicio &&
     trabajador.fecha_inicio > hoy)
    ||
    (trabajador.fecha_fin &&
     trabajador.fecha_fin < hoy)
  ){

    pintar(
      "Fuera de vigencia",
      "error"
    );

    return;
  }


  // ========================================================
  // DETERMINAR ACCIÓN
  // ========================================================

  accesoAbierto =
    trabajador.acceso_abierto_id;

  tipoAccion =
    accesoAbierto
      ? "salida"
      : "entrada";


  renderDetalle();


  // ========================================================
  // VALIDAR HORARIO DE ENTRADA
  // ========================================================

  if (tipoAccion === "entrada"){

    const ahora = new Date();

    const fechaMX =
      new Date(
        ahora.toLocaleString(
          "en-US",
          {
            timeZone:
              "America/Mexico_City"
          }
        )
      );

    const dia =
      fechaMX.getDay();

    let fueraHorarioEntrada =
      false;

    const minutosActuales =
      (fechaMX.getHours() * 60)
      +
      fechaMX.getMinutes();


    // Domingo
    if (dia === 0){

      fueraHorarioEntrada =
        true;
    }


    // Lunes a viernes
    else if (
      dia >= 1 &&
      dia <= 5 &&
      (
        minutosActuales < 465
        ||
        minutosActuales > 1050
      )
    ){

      fueraHorarioEntrada =
        true;
    }


    // Sábado
    else if (
      dia === 6 &&
      (
        minutosActuales < 525
        ||
        minutosActuales > 810
      )
    ){

      fueraHorarioEntrada =
        true;
    }


    if (fueraHorarioEntrada){

      document.body.className =
        "error";

      titulo.innerText =
        "🚫 Acceso denegado";

      estado.innerText =
        "Fuera de horario permitido";

      detalle.innerHTML = `

        <p>
          <b>${trabajador.nombre}</b>
        </p>

      `;

      ocultarValidacion();

      return;
    }
  }


  // ========================================================
  // VALIDAR HORARIO DE SALIDA
  // ========================================================

  let fueraHorario =
    false;

  if (tipoAccion === "salida"){

    const ahora =
      new Date();

    const fechaMX =
      new Date(
        ahora.toLocaleString(
          "en-US",
          {
            timeZone:
              "America/Mexico_City"
          }
        )
      );

    const dia =
      fechaMX.getDay();

    const minutosActuales =
      (fechaMX.getHours() * 60)
      +
      fechaMX.getMinutes();


    // Domingo
    if (dia === 0){

      fueraHorario =
        true;
    }


   // Sábado → reporte desde 14:21
else if (
  dia === 6 &&
  minutosActuales >= 861
){

  fueraHorario =
    true;
}


// Lunes a viernes → reporte desde 18:21
else if (
  dia >= 1 &&
  dia <= 5 &&
  minutosActuales >= 1101
){

  fueraHorario =
    true;
}

    if (fueraHorario){

      document.body.className =
        "warn";

      estado.innerText =
        "⚠️ Se realizará un reporte automático debido a que el trabajador sale fuera del horario permitido";
    }
  }


  // ========================================================
  // MENSAJE NORMAL
  // ========================================================

  if (
    !(tipoAccion === "salida" && fueraHorario)
  ){

    estado.innerText =
      tipoAccion === "salida"
        ? "Validar salida"
        : "Validar acceso";
  }


  titulo.innerText =
    tipoAccion === "salida"
      ? "🚧 Salida trabajador"
      : "🚧 Acceso obra";

  btnRegistrar.classList.add(
    "hidden"
  );

}


// ==========================================================
// VALIDAR PIN
// ==========================================================

btnValidar.onclick = async () => {

  const pin =
    document
      .getElementById("pin")
      .value
      .trim();

  if (!pin){

    ui.warn(
      "Ingrese PIN"
    );

    return;
  }

  const { data, error } =
    await supabaseClient
      .rpc(
        "validar_pin_vigilante",
        {
          pin_input: pin
        }
      );

  if (
    error ||
    !data ||
    data.length === 0
  ){

    ui.error(
      "PIN incorrecto"
    );

    return;
  }

  vigilante =
    data[0];

  ocultarValidacion();


  // ========================================================
  // SALIDA
  // ========================================================

  if (tipoAccion === "salida"){

    document.body.className =
      "warn";

    estado.innerText =
      "Autorizar salida";

    btnRegistrar.innerText =
      "Registrar salida";

    btnRegistrar.classList.remove(
      "hidden"
    );

    return;
  }


  // ========================================================
  // ENTRADA
  // ========================================================

  document.body.className =
    "ok";

  estado.innerText =
    "Acceso permitido";

  btnRegistrar.innerText =
    "Registrar entrada";

  btnRegistrar.classList.remove(
    "hidden"
  );

};


// ==========================================================
// REGISTRAR
// ==========================================================

btnRegistrar.onclick = async () => {

  btnRegistrar.disabled =
    true;

  btnRegistrar.innerText =
    "Procesando...";


  // ========================================================
  // SALIDA
  // ========================================================

  if (tipoAccion === "salida"){

    const { error } =
      await supabaseClient
        .rpc(
          "registrar_salida_trabajador_obra",
          {
            p_acceso_id:
              accesoAbierto,

            p_vigilante_id:
              vigilante.id
          }
        );

    if (error){

      console.error(
        "ERROR SALIDA:",
        error
      );

      ui.error(
        "Error al registrar salida"
      );

      btnRegistrar.disabled =
        false;

      btnRegistrar.innerText =
        "Registrar salida";

      return;
    }

    document.body.className =
      "ok";

    estado.innerText =
      "Salida registrada correctamente";

    detalle.innerHTML = `

      <p>
        <b>${trabajador.nombre}</b>
      </p>

      <p>
        Salida registrada
      </p>

    `;

    btnRegistrar.classList.add(
      "hidden"
    );

    return;
  }


  // ========================================================
  // ENTRADA
  // ========================================================

  const { error } =
    await supabaseClient
      .rpc(
        "entrada_trabajador",
        {
          trabajador:
            trabajador.trabajador_id,

          vigilante:
            vigilante.id
        }
      );

  if (error){

    console.error(
      "ERROR ENTRADA:",
      error
    );

    ui.error(
      error.message ||
      "Error al registrar entrada"
    );

    btnRegistrar.disabled =
      false;

    btnRegistrar.innerText =
      "Registrar entrada";

    return;
  }

  document.body.className =
    "ok";

  estado.innerText =
    "Acceso registrado correctamente";

  detalle.innerHTML = `

    <p>
      <b>${trabajador.nombre}</b>
    </p>

    <p>
      Entrada registrada
    </p>

  `;

  btnRegistrar.classList.add(
    "hidden"
  );

};


// ==========================================================
// UI
// ==========================================================

function renderDetalle(){

  detalle.innerHTML = `

    <p>
      <b>${trabajador.nombre}</b>
    </p>

  `;
}


function formatearFecha(
  fecha
){

  if (!fecha){

    return "No disponible";
  }

  const partes =
    fecha.split("-");

  if (
    partes.length !== 3
  ){

    return fecha;
  }

  return `
    ${partes[2]}/
    ${partes[1]}/
    ${partes[0]}
  `.replace(/\s+/g, "");

}


function pintar(
  texto,
  color
){

  document.body.className =
    color;

  estado.innerText =
    texto;

  ocultarValidacion();
}


function ocultarValidacion(){

  pin.style.display =
    "none";

  btnValidar.style.display =
    "none";
}

</script>

</body>
</html>
