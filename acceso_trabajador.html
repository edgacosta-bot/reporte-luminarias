<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store">

<title>Acceso Trabajador</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script src="/utils/ui.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Segoe UI", Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: #0f172a;
  color: white;
}

body.ok {
  background: #16a34a;
  color: white;
}

body.warn {
  background: #f59e0b;
  color: #111827;
}

body.error {
  background: #dc2626;
  color: white;
}

.container {
  width: 92%;
  max-width: 380px;
  padding: 24px;
}

.logo {
  width: 72px;
  height: 72px;
  object-fit: contain;
  margin-bottom: 12px;
}

.titulo {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 18px;
}

#estado {
  font-size: 27px;
  line-height: 1.2;
  margin: 12px 0;
}

#detalle {
  font-size: 16px;
  line-height: 1.5;
}

#detalle p {
  margin: 8px 0;
}

input,
button {
  width: 100%;
  height: 52px;
  padding: 0 16px;
  margin-top: 12px;
  border-radius: 14px;
  border: none;
  font-size: 16px;
  font-weight: 600;
}

input {
  background: #020617;
  color: white;
  text-align: center;
  font-size: 18px;
  letter-spacing: 3px;
}

button {
  background: #2563eb;
  color: white;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.hidden {
  display: none !important;
}

#mensaje {
  margin-top: 14px;
  font-size: 14px;
}

</style>

</head>

<body>

<div class="container">

  <img
    src="icono-512.png"
    class="logo"
    alt="Villas de la Concepción"
  >

  <div class="titulo" id="titulo">
    🚧 Acceso de trabajador
  </div>

  <h1 id="estado">
    Validando...
  </h1>

  <div id="detalle"></div>

  <input
    type="password"
    id="pin"
    placeholder="PIN del vigilante"
    inputmode="numeric"
    autocomplete="off"
  >

  <button id="btnValidar">
    Validar PIN
  </button>

  <button
    id="btnRegistrar"
    class="hidden"
  >
    Registrar
  </button>

  <div id="mensaje"></div>

</div>

<script>

/* ==========================================================
   VARIABLES
   ========================================================== */

const qr =
  new URLSearchParams(
    window.location.search
  ).get("qr");

let trabajador = null;
let vigilante = null;
let accesoAbierto = null;
let tipoAccion = null;


/* ==========================================================
   ELEMENTOS
   ========================================================== */

const titulo =
  document.getElementById("titulo");

const estado =
  document.getElementById("estado");

const detalle =
  document.getElementById("detalle");

const pin =
  document.getElementById("pin");

const btnValidar =
  document.getElementById("btnValidar");

const btnRegistrar =
  document.getElementById("btnRegistrar");

const mensaje =
  document.getElementById("mensaje");


/* ==========================================================
   INICIO
   ========================================================== */

init();


async function init() {

  ocultarControles();

  if (!qr) {

    pintar(
      "QR inválido",
      "error"
    );

    return;
  }


  try {

    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "validar_acceso_trabajador_obra",
        {
          p_qr: qr
        }
      );


    if (error) {

      console.error(
        "ERROR VALIDANDO QR:",
        error
      );

      pintar(
        error.message ||
        "Acceso no permitido",
        "error"
      );

      return;
    }


    if (
      !data ||
      data.length === 0
    ) {

      pintar(
        "Trabajador no encontrado",
        "error"
      );

      return;
    }


    trabajador = data[0];

    accesoAbierto =
      trabajador.acceso_abierto_id;


    /*
     * La consulta determina el estado actual
     * del acceso.
     *
     * NULL  = no existe entrada abierta
     * UUID  = existe una entrada abierta
     */

    tipoAccion =
      accesoAbierto
        ? "salida"
        : "entrada";


    renderTrabajador();


    /*
     * El Front únicamente presenta el estado
     * recibido del Backend.
     *
     * La autorización definitiva de entrada
     * corresponde a entrada_trabajador().
     */

    if (
      trabajador.activo !== true
    ) {

      pintar(
        "Trabajador inactivo",
        "error"
      );

      return;
    }


    if (
      trabajador.obra_aprobada !== true
    ) {

      pintar(
        "Obra no aprobada",
        "error"
      );

      return;
    }


    if (
      trabajador.acceso_suspendido === true
    ) {

      const hasta =
        trabajador.suspendido_hasta
          ? formatearFecha(
              trabajador.suspendido_hasta
            )
          : "";

      pintar(
        hasta
          ? `Acceso suspendido hasta ${hasta}`
          : "Acceso suspendido",
        "error"
      );

      return;
    }


    if (
      trabajador.dia_restringido === true
    ) {

      pintar(
        trabajador.motivo_restriccion ||
        "Acceso no permitido: día restringido",
        "error"
      );

      return;
    }


    /*
     * No hacemos aquí ninguna validación
     * de fecha_inicio / fecha_fin.
     *
     * Esa decisión corresponde al Backend.
     */


    mostrarOperacion();

  } catch (error) {

    console.error(
      "ERROR INICIALIZANDO ACCESO:",
      error
    );

    pintar(
      error.message ||
      "No fue posible validar el acceso",
      "error"
    );

  }

}


/* ==========================================================
   MOSTRAR DATOS DEL TRABAJADOR
   ========================================================== */

function renderTrabajador() {

  detalle.innerHTML = `
    <p>
      <b>${escapeHtml(
        trabajador.nombre || ""
      )}</b>
    </p>
  `;

}


/* ==========================================================
   MOSTRAR OPERACIÓN
   ========================================================== */

function mostrarOperacion() {

  if (
    tipoAccion === "salida"
  ) {

    document.body.className =
      "warn";

    titulo.innerText =
      "🚧 Salida de trabajador";

    estado.innerText =
      "Validar salida";

    mensaje.innerText =
      "";

  } else {

    document.body.className =
      "";

    titulo.innerText =
      "🚧 Acceso de trabajador";

    estado.innerText =
      "Validar entrada";

    mensaje.innerText =
      "";
  }


  pin.classList.remove(
    "hidden"
  );

  btnValidar.classList.remove(
    "hidden"
  );

  btnRegistrar.classList.add(
    "hidden"
  );

}


/* ==========================================================
   VALIDAR PIN DEL VIGILANTE
   ========================================================== */

btnValidar.addEventListener(
  "click",
  validarPin
);


async function validarPin() {

  const valorPin =
    pin.value.trim();


  if (!valorPin) {

    mostrarMensaje(
      "Ingrese el PIN del vigilante.",
      "error"
    );

    return;
  }


  btnValidar.disabled =
    true;

  btnValidar.innerText =
    "Validando...";


  try {

    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "validar_pin_vigilante",
        {
          pin_input: valorPin
        }
      );


    if (error) {

      console.error(
        "ERROR VALIDANDO PIN:",
        error
      );

      mostrarMensaje(
        error.message ||
        "No fue posible validar el PIN.",
        "error"
      );

      return;
    }


    if (
      !data ||
      data.length === 0
    ) {

      mostrarMensaje(
        "PIN de vigilante incorrecto.",
        "error"
      );

      return;
    }


    vigilante = data[0];


    pin.classList.add(
      "hidden"
    );

    btnValidar.classList.add(
      "hidden"
    );


    /*
     * El PIN del vigilante solamente autoriza
     * al vigilante para continuar.
     *
     * La entrada NO se considera registrada
     * en este punto.
     *
     * La pantalla verde solamente aparecerá
     * después de que entrada_trabajador()
     * confirme exitosamente el registro.
     */

    if (
      tipoAccion === "salida"
    ) {

      document.body.className =
        "warn";

      estado.innerText =
        "Autorizar salida";

      btnRegistrar.innerText =
        "Registrar salida";

    } else {

      document.body.className =
        "";

      estado.innerText =
        "Confirmar entrada";

      btnRegistrar.innerText =
        "Registrar entrada";
    }


    btnRegistrar.classList.remove(
      "hidden"
    );


  } catch (error) {

    console.error(
      "ERROR VALIDANDO PIN:",
      error
    );

    mostrarMensaje(
      error.message ||
      "No fue posible validar el PIN.",
      "error"
    );

  } finally {

    btnValidar.disabled =
      false;

    btnValidar.innerText =
      "Validar PIN";

  }

}

/* ==========================================================
   REGISTRAR OPERACIÓN
   ========================================================== */

btnRegistrar.addEventListener(
  "click",
  registrarOperacion
);


async function registrarOperacion() {

  if (!trabajador) {

    mostrarMensaje(
      "No existe un trabajador validado.",
      "error"
    );

    return;
  }


  if (!vigilante) {

    mostrarMensaje(
      "No existe un vigilante validado.",
      "error"
    );

    return;
  }


  btnRegistrar.disabled =
    true;

  btnRegistrar.innerText =
    "Procesando...";


  try {


    /* ======================================================
       SALIDA
       ====================================================== */

    if (
      tipoAccion === "salida"
    ) {

      if (!accesoAbierto) {

        throw new Error(
          "No existe un acceso abierto para registrar la salida."
        );

      }


      const {
        data,
        error
      } =
        await supabaseClient.rpc(
          "registrar_salida_trabajador_obra",
          {
            p_acceso_id:
              accesoAbierto,

            p_vigilante_id:
              vigilante.id
          }
        );


      if (error) {

        console.error(
          "ERROR REGISTRANDO SALIDA:",
          error
        );

        throw error;
      }


      if (
        !data ||
        data.length === 0 ||
        data[0].actualizado !== true
      ) {

        throw new Error(
          "La salida no pudo ser registrada."
        );

      }


      mostrarResultado(
        "Salida registrada correctamente",
        "Salida registrada"
      );

      return;
    }


    /* ======================================================
       ENTRADA
       ====================================================== */

    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "entrada_trabajador",
        {
          trabajador:
            trabajador.trabajador_id,

          vigilante:
            vigilante.id
        }
      );


    if (error) {

      console.error(
        "ERROR REGISTRANDO ENTRADA:",
        error
      );

      throw error;
    }


    mostrarResultado(
      "Entrada registrada correctamente",
      "Entrada registrada"
    );


  } catch (error) {

    console.error(
      "ERROR REGISTRANDO OPERACIÓN:",
      error
    );

    mostrarMensaje(
      error.message ||
      "No fue posible registrar la operación.",
      "error"
    );


    btnRegistrar.disabled =
      false;

    btnRegistrar.innerText =
      tipoAccion === "salida"
        ? "Registrar salida"
        : "Registrar entrada";

  }

}


/* ==========================================================
   RESULTADO EXITOSO
   ========================================================== */

function mostrarResultado(
  tituloResultado,
  detalleResultado
) {

  document.body.className =
    "ok";

  titulo.innerText =
    "🚧 Acceso de trabajador";

  estado.innerText =
    tituloResultado;

  detalle.innerHTML = `
    <p>
      <b>${escapeHtml(
        trabajador.nombre || ""
      )}</b>
    </p>

    <p>
      ${escapeHtml(
        detalleResultado
      )}
    </p>

    <button
      id="btnSalir"
      style="
        margin-top: 24px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 14px;
        width: 100%;
        height: 52px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      "
    >
      SALIR
    </button>
  `;

  mensaje.innerText =
    "";

  btnRegistrar.classList.add(
    "hidden"
  );

  pin.classList.add(
    "hidden"
  );

  btnValidar.classList.add(
    "hidden"
  );


  /*
   * La operación ya terminó correctamente.
   *
   * No volvemos a cargar la página.
   * No utilizamos history.back().
   * No eliminamos el parámetro ?qr=...
   *
   * SALIR intenta cerrar la ventana actual.
   */

  const btnSalir =
    document.getElementById(
      "btnSalir"
    );


  btnSalir.addEventListener(
    "click",
    () => {

      window.close();

    }
  );

}

/* ==========================================================
   PINTAR ESTADO
   ========================================================== */

function pintar(
  texto,
  clase
) {

  document.body.className =
    clase;

  estado.innerText =
    texto;

  ocultarControles();

}


/* ==========================================================
   OCULTAR CONTROLES
   ========================================================== */

function ocultarControles() {

  pin.classList.add(
    "hidden"
  );

  btnValidar.classList.add(
    "hidden"
  );

  btnRegistrar.classList.add(
    "hidden"
  );

}


/* ==========================================================
   MENSAJE
   ========================================================== */

function mostrarMensaje(
  texto,
  tipo
) {

  mensaje.innerText =
    texto;

  mensaje.style.color =
    tipo === "error"
      ? "#fecaca"
      : "inherit";

}


/* ==========================================================
   FORMATO DE FECHA
   ========================================================== */

function formatearFecha(
  fecha
) {

  if (!fecha) {
    return "";
  }

  const partes =
    fecha.split("-");

  if (
    partes.length !== 3
  ) {
    return fecha;
  }

  return `${partes[2]}/${partes[1]}/${partes[0]}`;

}


/* ==========================================================
   ESCAPE HTML
   ========================================================== */

function escapeHtml(
  valor
) {

  return String(valor)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

</script>

</body>
</html>
