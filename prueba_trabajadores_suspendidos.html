<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prueba - Trabajadores suspendidos</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>

<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 25px;
}

h2 {
  text-align: center;
}

.kpi {
  background: #1e293b;
  border-radius: 14px;
  padding: 20px;
  text-align: center;
  cursor: pointer;
  margin-bottom: 20px;
}

.kpi-numero {
  font-size: 42px;
  font-weight: bold;
  margin-top: 8px;
}

.lista {
  display: none;
}

.card {
  background: #1e293b;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 12px;
}

.nombre {
  font-size: 18px;
  font-weight: bold;
}

.detalle {
  font-size: 14px;
  margin-top: 6px;
  color: #cbd5e1;
}

.motivo {
  margin-top: 10px;
  padding: 10px;
  border-radius: 8px;
  background: #451a03;
  color: #fde68a;
  font-size: 13px;
  line-height: 1.4;
}

.sin-datos {
  text-align: center;
  color: #94a3b8;
  padding: 20px;
}

</style>

</head>

<body>

<div class="container">

  <h2>🚫 Trabajadores suspendidos</h2>

  <div
    class="kpi"
    id="kpi"
    onclick="mostrarDetalle()">

    <div>
      Trabajadores suspendidos actualmente
    </div>

    <div
      class="kpi-numero"
      id="total">
      0
    </div>

  </div>

  <div
    class="lista"
    id="lista">
  </div>

</div>


<script>

let trabajadoresSuspendidos = [];


// ==========================================================
// INICIO
// ==========================================================

window.addEventListener(
  "DOMContentLoaded",
  async () => {

    await cargarSuspendidos();

  }
);


// ==========================================================
// CARGAR
// ==========================================================

async function cargarSuspendidos() {

  const { data, error } =
    await supabaseClient
      .rpc("obtener_trabajadores_suspendidos");

  if (error) {

    console.error(
      "ERROR:",
      error
    );

    document.getElementById("total").innerText =
      "—";

    return;
  }

  trabajadoresSuspendidos =
    data || [];

  document.getElementById("total").innerText =
    trabajadoresSuspendidos.length;

}


// ==========================================================
// MOSTRAR DETALLE
// ==========================================================

function mostrarDetalle() {

  const lista =
    document.getElementById("lista");

  if (
    !trabajadoresSuspendidos ||
    trabajadoresSuspendidos.length === 0
  ) {

    lista.innerHTML = `
      <div class="sin-datos">
        No hay trabajadores suspendidos.
      </div>
    `;

    lista.style.display =
      "block";

    return;
  }

  lista.innerHTML = "";

  trabajadoresSuspendidos.forEach(t => {

    const card =
      document.createElement("div");

    card.className =
      "card";


    let motivo = "";

    if (t.motivo_suspension) {

      motivo = `
        <div class="motivo">
          <b>Motivo:</b><br>
          ${t.motivo_suspension}
        </div>
      `;

    } else {

      motivo = `
        <div class="motivo">
          <b>Motivo:</b><br>
          No disponible en el registro de prueba.
        </div>
      `;
    }


    card.innerHTML = `

      <div class="nombre">
        ${t.nombre}
      </div>

      <div class="detalle">
        Privada ${t.privada} · Lote ${t.casa}
      </div>

      <div class="detalle">
        <b>Suspendido hasta:</b>
        ${formatearFecha(t.suspendido_hasta)}
      </div>

      ${motivo}

    `;

    lista.appendChild(card);

  });

  lista.style.display =
    "block";

}


// ==========================================================
// FECHA
// ==========================================================

function formatearFecha(fecha) {

  if (!fecha) {

    return "No disponible";

  }

  const partes =
    fecha.split("-");

  if (partes.length !== 3) {

    return fecha;

  }

  return `${partes[2]}/${partes[1]}/${partes[0]}`;

}

</script>

</body>
</html>
